[project]
name = "concept-paths"
version = "0.1.0"
description = "Minimal research codebase for concept-path tracking with nnsight."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
  "transformers>=4.40",
  "nnsight>=0.5.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pytest>=7.0",
]

[tool.ruff]
line-length = 100
